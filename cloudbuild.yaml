###############################################################################
# LEXGUARD — Cloud Build pipeline
# Triggered automatically when code is pushed to the main branch via the
# Cloud Build GitHub App connection (set up in GCP Console → Cloud Build →
# Triggers → Connect Repository).
#
# Required substitution variables (set in the trigger config):
#   _REGION   — e.g. us-central1
#   _PROJECT  — your GCP project ID (auto-available as $PROJECT_ID too)
###############################################################################

substitutions:
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ── 1. Build API image ────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/lexguard/api:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/lexguard/api:latest
      - .

  # ── 2. Push API image ─────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-api
    waitFor: [build-api]
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/lexguard/api

  # ── 3. Deploy API to Cloud Run ────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-api
    waitFor: [push-api]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - lexguard-api
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/lexguard/api:$SHORT_SHA
      - --region=${_REGION}
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --max-instances=5
      - --set-env-vars=NODE_ENV=production,USE_VERTEX_AI=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VERTEX_AI_LOCATION=${_REGION},GEMINI_API_KEY_SECRET=gemini-api-key
      - --quiet

  # ── 4. Get API URL for web build ──────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: get-api-url
    waitFor: [deploy-api]
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$(gcloud run services describe lexguard-api \
          --region=${_REGION} --format='value(status.url)')
        echo "$$API_URL" > /workspace/api_url.txt
        echo "API URL: $$API_URL"

  # ── 5. Build Web image ────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-web
    waitFor: [get-api-url]
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$(cat /workspace/api_url.txt)
        docker build \
          -f apps/web/Dockerfile \
          --build-arg NEXT_PUBLIC_API_URL="$$API_URL" \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/lexguard/web:$SHORT_SHA \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/lexguard/web:latest \
          .

  # ── 6. Push Web image ─────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-web
    waitFor: [build-web]
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/lexguard/web

  # ── 7. Deploy Web to Cloud Run ────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-web
    waitFor: [push-web]
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$(cat /workspace/api_url.txt)
        gcloud run deploy lexguard-web \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/lexguard/web:$SHORT_SHA \
          --region=${_REGION} \
          --allow-unauthenticated \
          --memory=512Mi \
          --cpu=1 \
          --max-instances=5 \
          --set-env-vars="NEXT_PUBLIC_API_URL=$$API_URL,NODE_ENV=production" \
          --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/lexguard/api:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/lexguard/web:$SHORT_SHA
